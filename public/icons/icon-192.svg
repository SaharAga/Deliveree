<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3b82f6" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Glowing Isometric Box -->
  <g filter="url(#glow)" transform="translate(0, 4)">
    <!-- Top Face -->
    <polygon points="96,38 148,68 96,98 44,68" fill="url(#boxGrad3)"/>
    <!-- Left Face -->
    <polygon points="44,68 96,98 96,154 44,124" fill="url(#boxGrad1)"/>
    <!-- Right Face -->
    <polygon points="96,98 148,68 148,124 96,154" fill="url(#boxGrad2)"/>
    
    <!-- Top Tape -->
    <polygon points="96,48 116,60 96,72 76,60" fill="#ffffff" opacity="0.3"/>
    
    <!-- Checkmark Badge -->
    <circle cx="134" cy="130" r="22" fill="#10b981" stroke="#0f172a" stroke-width="3"/>
    <path d="M124 130 l7 7 l14 -14" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
